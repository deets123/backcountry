[project]
name = "backcountry"
version = "0.1.0"
description = "Generate multi-day backpacking routes from real trail geometry."
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.7.22",
    "fastapi>=0.143.0",
    "folium>=0.17",
    "gpxpy>=1.6.2",
    "networkx>=3.2",
    "numpy>=2.4.6",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "rasterio>=1.4.4",
    "shapely>=2.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
backcountry = "backcountry.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backcountry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside rasterio itself (affine's `*` deprecation), not in this project's code.
    "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning:rasterio",
]
