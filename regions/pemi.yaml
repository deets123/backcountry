# Pemigewasset Wilderness, White Mountain National Forest, NH.
#
# bbox is in WGS84 degrees. It is a fetch extent only, not a place claim; the QA
# report checks it against the OSM/USFS wilderness boundary.
id: pemi
name: Pemigewasset Wilderness, NH
crs: EPSG:32619  # UTM zone 19N; all internal distances are meters in this CRS
bbox:
  south: 44.00
  west: -71.72
  north: 44.26
  east: -71.38

boundary_name_regex: "Pemigewasset"
usfs_crosscheck: true

# Trailheads are added after `backcountry trailheads` / `backcountry verify` on real data,
# by graph node (OSM node id), never by typed-in coordinates. `verified` is yours to set.
# Each entry points at a graph node (OSM node id) nearest the USFS recreation-site location,
# from `backcountry verify` on 2026-10-13. `verified` is yours to set after checking.
trailheads:
